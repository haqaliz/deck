name: Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "linux-v*"

jobs:
  appimage:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: base packages
        working-directory: .
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl build-essential pkg-config \
            libgtk-4-dev libgtk4-layer-shell-dev gtk-update-icon-cache \
            desktop-file-utils file libfuse2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build AppImage
        working-directory: linux
        run: bash packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deck-appimage
          path: |
            linux/dist/deck_*.AppImage
            linux/dist/deck_*.AppImage.sha256

  release:
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deck-appimage
          path: dist
      - name: publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Deck for Linux $tag" --generate-notes --verify-tag
          gh release upload "$tag" dist/* --clobber
