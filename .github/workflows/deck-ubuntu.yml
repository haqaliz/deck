# Deck — build, and signed GitHub Releases on version tags.
#
# Secrets required for signed releases (set in repo Settings → Secrets):
#   APPLE_CERT_P12_BASE64        base64 of an exported "Apple Development" .p12
#                                (Keychain Access → export certificate + private key)
#   APPLE_CERT_PASSWORD          password of that .p12
#   APPLE_ID                     Apple ID (haqaliz@aol.com)
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (appleid.apple.com → Sign-In & Security)
#   APPLE_TEAM_ID                K6X49DG8VF
#
# Without the secrets the workflow still builds for PRs (unsigned, compile-only —
# unsigned widgets cannot be registered by pluginkit, so only tag releases ship).

name: Deck

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Apple Development certificate
        if: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 -d > cert.p12
          security create-keychain -p deck-ci deck-ci.keychain-db
          security set-keychain-settings -lut 21600 deck-ci.keychain-db
          security unlock-keychain -p deck-ci deck-ci.keychain-db
          security import cert.p12 -k deck-ci.keychain-db -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k deck-ci deck-ci.keychain-db
          security default-keychain -s deck-ci.keychain-db
          security list-keychains -d user -s deck-ci.keychain-db

      - name: Generate project
        run: xcodegen generate --spec native/project.yml

      - name: Build (signed, auto-provisioned)
        if: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project native/Deck.xcodeproj -scheme DeckApp -configuration Release \
            -derivedDataPath native/build -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration build

      - name: Build (unsigned, compile check)
        if: ${{ secrets.APPLE_CERT_P12_BASE64 == '' }}
        run: |
          xcodebuild -project native/Deck.xcodeproj -scheme DeckApp -configuration Release \
            -derivedDataPath native/build CODE_SIGNING_ALLOWED=NO build

      - name: Package Deck.app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd native/build/Build/Products/Release
          zip -r Deck-macos.zip Deck.app
          shasum -a 256 Deck-macos.zip > Deck-macos.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd native/build/Build/Products/Release
          gh release create "$GITHUB_REF_NAME" Deck-macos.zip Deck-macos.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --generate-notes
