name: Linux Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - "linux-v*"

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - name: base packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git ca-certificates curl flatpak flatpak-builder ccache
      - uses: actions/checkout@v4
      - name: install runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable
      - name: build flatpak
        run: |
          flatpak-builder --user --repo=repo --force-clean \
            --install-deps-from=flathub --disable-rofiles-fuse \
            build-dir flatpak/io.github.haqaliz.deck.yml
          version="$(grep '^version = ' linux/Cargo.toml | head -1 | cut -d'"' -f2)"
          flatpak build-bundle repo "deck_${version}_x86_64.flatpak" io.github.haqaliz.deck
          sha256sum "deck_${version}_x86_64.flatpak" > "deck_${version}_x86_64.flatpak.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: deck-flatpak
          path: |
            deck_*.flatpak
            deck_*.flatpak.sha256

  release:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deck-flatpak
          path: dist
      - name: publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Deck for Linux $tag" --generate-notes --verify-tag
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
