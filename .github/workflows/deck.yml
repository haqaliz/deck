# Deck — build, and signed GitHub Releases on version tags.
#
# Secrets required for signed releases (set in repo Settings → Secrets):
#   APPLE_CERT_P12_BASE64        base64 of an exported "Apple Development" .p12
#                                (Keychain Access → export certificate + private key)
#   APPLE_CERT_PASSWORD          password of that .p12
#   APPLE_ID                     Apple ID (haqaliz@aol.com)
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (appleid.apple.com → Sign-In & Security)
#   APPLE_TEAM_ID                K6X49DG8VF
#
# Without the secrets the workflow still builds for PRs (unsigned, compile-only —
# unsigned widgets cannot be registered by pluginkit, so only tag releases ship).

name: Deck

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Check signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          if [ -n "$HAS_CERT" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import Apple Development certificate
        if: steps.signing.outputs.available == 'true'
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 -d > cert.p12
          security create-keychain -p deck-ci deck-ci.keychain-db
          security set-keychain-settings -lut 21600 deck-ci.keychain-db
          security unlock-keychain -p deck-ci deck-ci.keychain-db
          security import cert.p12 -k deck-ci.keychain-db -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k deck-ci deck-ci.keychain-db
          security default-keychain -s deck-ci.keychain-db
          security list-keychains -d user -s deck-ci.keychain-db

      - name: Generate project
        run: xcodegen generate --spec native/project.yml

      - name: Test (shared parsers)
        run: |
          xcodebuild test -project native/Deck.xcodeproj -scheme DeckSharedTests \
            -derivedDataPath native/build.noindex CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
          if ! grep -q "Test Suite 'All tests' passed" test.log; then
            echo "::error::Shared parser test suite did not pass"
            exit 1
          fi
          if ! grep -qE "Executed [1-9][0-9]* test" test.log; then
            echo "::error::No tests executed (misconfigured target passes silently)"
            exit 1
          fi

      - name: Build (signed, auto-provisioned)
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project native/Deck.xcodeproj -scheme DeckApp -configuration Release \
            -derivedDataPath native/build.noindex -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration build

      - name: Verify hardened runtime
        if: steps.signing.outputs.available == 'true'
        run: |
          # The unit suite guards project.yml; this guards the product. A green
          # run has published an unopenable artifact here before (the HFS+ DMG
          # that shipped as v1.40), and an unhardened binary fails notarization
          # the same way -- late, and after the release exists.
          cd native/build.noindex/Build/Products/Release
          fail=0
          for target in \
            "Deck.app" \
            "Deck.app/Contents/PlugIns/DeckWidgets.appex" \
            "Deck.app/Contents/MacOS/DeckAgent"; do
            flags=$(codesign -dvvv "$target" 2>&1 | grep -oE 'flags=0x[0-9a-f]+ *\([^)]*\)' || true)
            case "$flags" in
              *runtime*) echo "ok   $target  $flags" ;;
              *)         echo "::error::$target would ship without hardened runtime (${flags:-no signature})"
                         fail=1 ;;
            esac
          done
          exit $fail

      - name: Build (unsigned, compile check)
        if: steps.signing.outputs.available == 'false'
        run: |
          xcodebuild -project native/Deck.xcodeproj -scheme DeckApp -configuration Release \
            -derivedDataPath native/build.noindex CODE_SIGNING_ALLOWED=NO build

      - name: Package Deck.app (DMG)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ github.ref_name }}
          SIGNED: ${{ steps.signing.outputs.available }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd native/build.noindex/Build/Products/Release

          # DMG: a staging folder holding the app next to an /Applications
          # symlink, so the mounted volume is the usual drag-to-install window.
          rm -rf dmg-stage && mkdir dmg-stage
          cp -R Deck.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          # APFS, not HFS+. macOS 26 is deprecating HFS+, and on the
          # macos-26-arm64 runner `hdiutil create -fs HFS+` produced an image
          # that would not mount -- three times running, for v1.40, on the same
          # runner image that built a working v1.39 hours earlier. APFS disk
          # images are readable on macOS 10.13+, far below Deck's own macOS 15
          # deployment target, so nothing is lost.
          hdiutil create -volname Deck -srcfolder dmg-stage -ov \
            -format UDZO -fs APFS "Deck-${VERSION}.dmg"
          rm -rf dmg-stage

          # Signing the DMG is cosmetic while the app is Apple Development
          # signed (Gatekeeper rejects it either way), but it is the line that
          # starts mattering the day this switches to Developer ID + notarytool.
          if [ "$SIGNED" = "true" ]; then
            codesign --force --sign "$APPLE_TEAM_ID" --timestamp "Deck-${VERSION}.dmg" \
              || echo "::warning::DMG signing failed; shipping it unsigned"
          fi

          # The image must be readable before it is published. v1.40 was cut
          # twice with a DMG that failed `hdiutil attach` and `hdiutil convert`
          # with "corrupt image" -- structurally intact (koly trailer fine, XML
          # plist parsing with 8 blkx entries) but with a damaged data fork, on
          # the same runner image that built a working v1.39. Nothing in the
          # job noticed: the run was green, the release published, and the
          # checksum matched the broken bytes exactly. Verify, and mount it,
          # before anyone can download it.
          hdiutil verify "Deck-${VERSION}.dmg"
          hdiutil attach "Deck-${VERSION}.dmg" -nobrowse -readonly -mountpoint /tmp/dmgcheck
          test -d /tmp/dmgcheck/Deck.app || { echo "::error::DMG mounted but has no Deck.app"; exit 1; }
          hdiutil detach /tmp/dmgcheck

          # Checksums last, so they cover the final bytes of every artifact.
          shasum -a 256 "Deck-${VERSION}.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          cd native/build.noindex/Build/Products/Release
          # The heredoc body carries the block scalar's indentation; strip it
          # so the release notes are markdown and not one big code block.
          sed 's/^ \{10\}//' > notes.md <<'NOTES'
          ## Install

          Download `Deck-VERSION_PLACEHOLDER.dmg`, open it, drag **Deck** to Applications.

          Deck is signed with an Apple Development certificate and is **not
          notarized**, so macOS quarantines it on download and refuses to open
          it. Clear the quarantine flag once, then launch:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Deck.app
          open /Applications/Deck.app
          ```

          On macOS 15 there is no Control-click shortcut for this any more; the
          command above (or System Settings -> Privacy & Security -> Open
          Anyway) is the only path until Deck ships notarized.

          Then right-click the desktop -> **Edit Widgets...** -> search "Deck".

          Verify the download against `SHA256SUMS.txt`.
          NOTES
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" notes.md

          gh release create "$GITHUB_REF_NAME" \
            "Deck-${VERSION}.dmg" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes
