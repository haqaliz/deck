name: Linux

on:
  push:
    branches: [master]
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"

defaults:
  run:
    working-directory: linux

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgtk4-layer-shell-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --workspace --release

  aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - name: cross build (headless crates)
        # The GTK4 GUI is built natively on the Pi for the .deb in L6; a
        # cross-sysroot with GTK4 + gtk4-layer-shell is not worth maintaining.
        run: cross build --release -p deck-core -p deckd -p deck-cli --target aarch64-unknown-linux-gnu
