name: Deck
options:
  bundleIdPrefix: com.deck
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  DeckApp:
    type: application
    platform: macOS
    sources:
      - DeckApp
      - Shared
    resources:
      - DeckApp/Resources
    dependencies:
      - target: DeckWidgets
        embed: true
      - target: DeckAgent
    postBuildScripts:
      - name: Embed DeckAgent
        script: |
          cp "$BUILT_PRODUCTS_DIR/DeckAgent" "$BUILT_PRODUCTS_DIR/Deck.app/Contents/MacOS/DeckAgent"
          chmod +x "$BUILT_PRODUCTS_DIR/Deck.app/Contents/MacOS/DeckAgent"
    info:
      path: DeckApp/Info.plist
      properties:
        CFBundleDisplayName: Deck
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.22"
        CFBundleVersion: "22"
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        NSCalendarsFullAccessUsageDescription: "Deck reads your calendar to show your next event in the CalBox widget."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deck.app
        PRODUCT_NAME: Deck
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: K6X49DG8VF
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
      configs:
        Release:
          # Xcode injects com.apple.security.get-task-allow for development
          # signing, which lets any local process attach a debugger to a
          # shipped Deck — the process holding the calendar grant, the
          # clipboard history and three API tokens. Debug builds keep it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  DeckWidgets:
    type: app-extension
    platform: macOS
    sources:
      - DeckWidgets
      - Shared
    resources:
      - DeckWidgets/AppIcon.icns
    info:
      path: DeckWidgets/Info.plist
      properties:
        CFBundleDisplayName: Deck Widgets
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.22"
        CFBundleVersion: "22"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deck.app.widgets
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: K6X49DG8VF
        CODE_SIGN_ENTITLEMENTS: DeckWidgets/DeckWidgets.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
      configs:
        Release:
          # Xcode injects com.apple.security.get-task-allow for development
          # signing, which lets any local process attach a debugger to a
          # shipped Deck — the process holding the calendar grant, the
          # clipboard history and three API tokens. Debug builds keep it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  DeckAgent:
    type: tool
    platform: macOS
    sources:
      - DeckAgent
      - Shared
    info:
      path: DeckAgent/Info.plist
      properties:
        CFBundleIdentifier: com.deck.agent
        CFBundleName: DeckAgent
        CFBundleExecutable: DeckAgent
        CFBundleShortVersionString: "1.22"
        CFBundleVersion: "22"
        NSCalendarsFullAccessUsageDescription: "Deck reads your calendar to show your next event in the CalBox widget."
    settings:
      base:
        PRODUCT_NAME: DeckAgent
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: K6X49DG8VF
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
      configs:
        Release:
          # Xcode injects com.apple.security.get-task-allow for development
          # signing, which lets any local process attach a debugger to a
          # shipped Deck — the process holding the calendar grant, the
          # clipboard history and three API tokens. Debug builds keep it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  DeckSharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Shared
      - SharedTests
    resources:
      - SharedTests/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deck.sharedtests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: K6X49DG8VF
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
schemes:
  DeckSharedTests:
    build:
      targets:
        DeckSharedTests: all
    test:
      targets:
        - DeckSharedTests
